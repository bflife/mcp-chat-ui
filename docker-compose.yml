version: "3.9"

services:
  mcp-chat-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-chat-ui
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
